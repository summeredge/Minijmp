name: Windows release candidate

# Public Windows candidate: builds, verifies and uploads Actions artifacts.
# Creating a GitHub Release stays a separate, manually approved job.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的版本 Tag（例如 v1.2.1）
        required: true
        type: string
      publish:
        description: 人工批准发布（还需仓库变量 MINIJMP_ENABLE_PUBLISH 为 true）
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify the public candidate
    runs-on: windows-2022
    timeout-minutes: 120
    outputs:
      product: ${{ steps.meta.outputs.product }}
      release: ${{ steps.meta.outputs.release }}
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - name: Check out the version tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/windows/requirements-py311.lock

      - name: Install the locked build dependencies
        run: python -m pip install -r packaging/windows/requirements-py311.lock

      - name: Check the tag, the version identifiers and the build commit
        shell: powershell
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/release_metadata.py --verify-tag $env:TAG
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:TAG does not identify this build." }
          python tools/release_metadata.py
          if ($LASTEXITCODE -ne 0) { throw 'Version identifiers disagree; fix them before building.' }
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) { throw "Checked out $head, but this run names $env:GITHUB_SHA." }
          if (@(git status --porcelain --untracked-files=normal).Count) {
            throw 'The checked out tree is not clean.'
          }

      - name: Record the version under build
        id: meta
        shell: powershell
        run: |
          $product = (python tools/release_metadata.py --print-product).Trim()
          $release = (python tools/release_metadata.py --print-release).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the release metadata.' }
          "product=$product" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "release=$release" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "artifact=MiniJMP-$release-windows-x64-candidate" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          Write-Output "Candidate $release of $product"

      - name: Run the packaging, worksheet, file and clipboard tests
        shell: powershell
        run: |
          python -m pytest tests/test_windows_packaging.py tests/test_windows_release_tools.py `
            tests/test_release_sbom.py tests/test_public_release_verify.py `
            tests/test_file_io.py tests/test_worksheets.py tests/test_sheet_context.py `
            tests/test_context_clipboard.py -q

      - name: Build the public candidate
        shell: powershell
        env:
          # Window titles are Chinese; the runner console defaults to cp1252.
          PYTHONIOENCODING: utf-8
        run: |
          $python = (Get-Command python).Source
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build_windows_release.ps1 -Public -PythonPath $python

      - name: Verify the candidate and write the job summary
        shell: powershell
        env:
          RELEASE: ${{ steps.meta.outputs.release }}
          ARTIFACT: ${{ steps.meta.outputs.artifact }}
        run: |
          python tools/verify_public_release.py "dist/MiniJMP-$env:RELEASE-Release" `
            --release $env:RELEASE --commit $env:GITHUB_SHA `
            --artifact $env:ARTIFACT --summary $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) { throw 'The candidate failed verification.' }

      - name: Upload the candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/MiniJMP-${{ steps.meta.outputs.release }}-Release/MiniJMP-*.zip
            dist/MiniJMP-${{ steps.meta.outputs.release }}-Release/SHA256SUMS-*.txt
            dist/MiniJMP-${{ steps.meta.outputs.release }}-Release/SBOM.*
            dist/MiniJMP-${{ steps.meta.outputs.release }}-Release/RUNTIME-CONTENTS.csv
            dist/MiniJMP-${{ steps.meta.outputs.release }}/BUILD-INFO.txt
            dist/MiniJMP-${{ steps.meta.outputs.release }}/SOURCE-CODE.txt
            docs/release/pyinstaller-build-${{ steps.meta.outputs.release }}.txt
            docs/release/build-inputs-${{ steps.meta.outputs.release }}.txt

  publish:
    name: Publish the approved release
    needs: build
    # Reserved entry point. It only runs for a manual dispatch that asks for it,
    # after the build job verified the candidate, and only when the repository
    # variable MINIJMP_ENABLE_PUBLISH is true. Tag pushes never publish.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish &&
      vars.MINIJMP_ENABLE_PUBLISH == 'true'
    runs-on: windows-2022
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download the verified candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: candidate

      - name: Re-check the downloaded digests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The artifact keeps the repository layout, so the candidate directory
          # is nested below it.
          $sums = @(Get-ChildItem -LiteralPath candidate -Recurse -Filter 'SHA256SUMS-*.txt')
          if ($sums.Count -ne 1) { throw 'Expected exactly one SHA256SUMS file.' }
          $root = $sums[0].Directory.FullName
          foreach ($line in Get-Content -LiteralPath $sums[0].FullName) {
            if (!$line.Trim()) { continue }
            $parts = $line -split '  ', 2
            if ($parts.Count -ne 2) { throw "Malformed SHA256SUMS line: $line" }
            $digest, $relative = $parts
            $path = Join-Path $root $relative
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing asset: $relative" }
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $digest) {
              throw "Digest drift in the downloaded assets: $relative"
            }
          }

      - name: Publish with gh release create
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.product }}
          NOTES: MiniJMP ${{ needs.build.outputs.product }} 公开候选包：经自动构建验证并由人工批准发布。源码包与 SHA256 校验文件见附件。
        run: |
          $sums = @(Get-ChildItem -LiteralPath candidate -Recurse -Filter 'SHA256SUMS-*.txt')[0]
          $assets = @(Get-ChildItem -LiteralPath $sums.Directory.FullName -File | Where-Object {
            $_.Extension -in '.zip', '.json', '.csv', '.txt' } | ForEach-Object { $_.FullName })
          # gh reports upload progress on stderr; only its exit code decides, and
          # it refuses to overwrite an existing release.
          $ErrorActionPreference = 'Continue'
          gh release create $env:TAG --verify-tag --title "MiniJMP $env:TAG" --notes $env:NOTES @assets
          if ($LASTEXITCODE -ne 0) {
            throw 'gh release create failed; an existing release is never overwritten.'
          }
